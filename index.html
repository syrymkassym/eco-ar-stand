<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Eco AR Stand</title>
<style>
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#06100a;color:#eef8ef;font-family:Inter,Arial,sans-serif}#app{position:fixed;inset:0}#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:radial-gradient(circle,#29452f,#06100a 72%);filter:brightness(.62) saturate(.8)}#scene{position:absolute;inset:0}#intro{position:absolute;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:#06100aeb}.card{width:min(460px,92vw);padding:32px 26px;border:1px solid #397c48;border-radius:28px;background:#071a0eec;text-align:center;box-shadow:0 30px 80px #0009}.logo{width:72px;height:72px;margin:auto auto 18px;border:1px solid #397c48;border-radius:20px;display:grid;place-items:center;font-size:38px;background:#0d2a15}h1{font-size:clamp(30px,7vw,48px);line-height:1.04;margin:0 0 15px}.card p{color:#b9cbbd;line-height:1.55;font-size:16px}.start{width:100%;padding:16px;border:0;border-radius:15px;background:linear-gradient(135deg,#79ed82,#37c86a);font-weight:800;font-size:17px;cursor:pointer}.status{min-height:20px;color:#ffb3a5;font-size:12px;margin-top:10px}#top{position:absolute;z-index:10;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}.brand,#langs{pointer-events:auto;border:1px solid #397c48;background:#06150bd0;backdrop-filter:blur(12px);border-radius:14px;padding:9px 12px}.brand{font-weight:800}.lang{border:0;background:transparent;color:#dcefe0;padding:5px 8px;border-radius:8px;cursor:pointer}.lang.active{background:#2c7b45}#progress{position:absolute;z-index:9;top:75px;left:50%;transform:translateX(-50%);width:min(560px,72vw);display:flex;align-items:center}.dot{width:22px;height:22px;flex:none;border:1px solid #6dbd78;border-radius:50%;display:grid;place-items:center;background:#0b1d11;font-size:10px}.dot.active{background:#42a958;box-shadow:0 0 18px #42a95888}.line{height:2px;flex:1;background:#345f40}.line.done{background:#6ad578}#info{position:absolute;z-index:11;left:18px;top:115px;width:min(340px,34vw)}.info{padding:17px;border:1px solid #4d9958;border-radius:20px;background:#06160bd0;backdrop-filter:blur(13px)}.num{font-size:11px;color:#75d17e;font-weight:800;letter-spacing:.12em}.title{font-size:22px;font-weight:850;margin:6px 0}.sub{font-size:13px;line-height:1.45;color:#bed1c2}#hint{position:absolute;z-index:12;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 14px;border:1px solid #397c48;border-radius:13px;background:#06150bd9;color:#d6e8d9;font-size:12px;pointer-events:none}#aiFab{position:absolute;z-index:25;right:18px;bottom:18px;width:58px;height:58px;border:1px solid #63bd6e;border-radius:50%;background:#071c0edb;color:#e6ffe9;font-size:24px;cursor:pointer;box-shadow:0 10px 30px #0008}#ai{position:absolute;z-index:30;right:18px;bottom:88px;width:min(370px,calc(100vw - 28px));max-height:70vh;display:none;flex-direction:column;border:1px solid #397c48;border-radius:20px;background:#06160bf2;backdrop-filter:blur(16px);overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid #ffffff12;display:flex;justify-content:space-between}.head span{font-size:12px;color:#7dd489}.chat{padding:13px;overflow:auto;display:flex;flex-direction:column;gap:9px}.msg{max-width:92%;padding:10px 12px;border-radius:13px;font-size:13px;line-height:1.45}.aiMsg{align-self:flex-start;background:#10291a;border:1px solid #285d38}.userMsg{align-self:flex-end;background:#286e3e}.controls{display:flex;gap:6px;padding:9px;border-top:1px solid #ffffff12}.controls input{min-width:0;flex:1;background:#08150c;color:#fff;border:1px solid #315c3c;border-radius:10px;padding:9px}.controls button{border:1px solid #458e51;background:#10301a;color:#eaffed;border-radius:10px;padding:8px 10px;cursor:pointer}
@media(max-width:700px){#top{top:9px;left:9px;right:9px}.brand{font-size:11px;padding:8px 9px}#progress{top:57px;width:84vw}#info{left:9px;top:auto;bottom:82px;width:min(285px,68vw)}.info{padding:13px;border-radius:16px}.title{font-size:17px}.sub{font-size:11px}#hint{bottom:10px;max-width:88vw;text-align:center;font-size:10px}#aiFab{right:11px;bottom:11px}#ai{right:10px;bottom:78px;width:calc(100vw - 20px)}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body><div id="app"><video id="camera" autoplay playsinline muted></video><div id="scene"></div>
<div id="intro"><div class="card"><div class="logo">♻</div><h1>Экологическая<br>безопасность</h1><p>Интерактивный AR-стенд: изучайте экологический путь, перемещайте его по пространству и приближайте жестами.</p><button class="start" id="start">Разрешить камеру и начать</button><div class="status" id="status"></div></div></div>
<div id="top"><div class="brand">ЭКО · AR STAND</div><div id="langs"><button class="lang active" data-l="ru">RU</button><button class="lang" data-l="kz">KZ</button></div></div><div id="progress"></div><div id="info"><div class="info"><div class="num" id="num"></div><div class="title" id="title"></div><div class="sub" id="sub"></div></div></div><div id="hint">☝ Один палец — перемещение · 🤏 Два пальца — масштаб</div>
<button id="aiFab">✦</button><div id="ai"><div class="head"><b>✦ AI-гид</b><span>помощник</span></div><div class="chat" id="chat"></div><div class="controls"><input id="input" placeholder="Спросите о стенде..."><button id="speak">🔊</button><button id="send">➤</button></div></div></div>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const S=[
['Основные экологические угрозы','Негізгі экологиялық қауіп-қатерлер','Загрязнение воздуха, воды и почвы. Неправильное обращение с отходами. Истощение природных ресурсов.','Ауа, су және топырақтың ластануы. Қалдықтармен дұрыс жұмыс істемеу. Табиғи ресурстардың сарқылуы.','⚠'],
['Экологическая безопасность в Казахстане','Қазақстан Республикасындағы экологиялық қауіпсіздік','Соблюдение требований экологического законодательства. Рациональное использование природных ресурсов. Предотвращение загрязнения окружающей среды.','Экологиялық заңнама талаптарын сақтау. Табиғи ресурстарды ұтымды пайдалану. Қоршаған ортаның ластануына жол бермеу.','KZ'],
['Правильная сортировка отходов','Қалдықтарды дұрыс сұрыптау','Reduce — сокращение образования отходов. Reuse — повторное использование. Recycle — переработка отходов.','Reduce — қалдықтардың түзілуін азайту. Reuse — қайта пайдалану. Recycle — қалдықтарды қайта өңдеу.','♻'],
['Что может сделать каждый','Әркім не істей алады','Сортировать отходы. Экономить воду и электроэнергию. Не загрязнять окружающую среду. Участвовать в озеленении и посадке деревьев.','Қалдықтарды сұрыптау. Су мен электр энергиясын үнемдеу. Қоршаған ортаны ластамау. Ағаш отырғызуға және көгалдандыруға қатысу.','🌱'],
['Утилизация отходов','Қалдықтарды кәдеге жарату','Передавать отходы на переработку. Опасные отходы сдавать в специализированные пункты. Соблюдать правила раздельного сбора отходов.','Қалдықтарды қайта өңдеуге тапсыру. Қауіпті қалдықтарды мамандандырылған қабылдау орындарына өткізу. Қалдықтарды бөлек жинау қағидаларын сақтау.','♻'],
['Участие в природоохранных мероприятиях','Табиғатты қорғау іс-шараларына қатысу','Участвовать в экологических акциях и субботниках. Поддерживать чистоту окружающей среды. Бережно относиться к природе.','Экологиялық акциялар мен сенбіліктерге қатысу. Қоршаған ортаның тазалығын сақтау. Табиғатқа ұқыпты қарау.','🌍']];
let lang='ru',cur=0;const video=document.getElementById('camera'),sceneEl=document.getElementById('scene');
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);cam.position.set(0,0,13);
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);sceneEl.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,1.8));let dl=new THREE.DirectionalLight(0xffffff,2.4);dl.position.set(4,6,8);scene.add(dl);let glow=new THREE.PointLight(0x5de174,10,30);glow.position.set(-4,2,5);scene.add(glow);
const stand=new THREE.Group();scene.add(stand);const board=new THREE.Mesh(new THREE.BoxGeometry(10.5,7.1,.18),new THREE.MeshStandardMaterial({color:0xf1f5ed,roughness:.75}));stand.add(board);
function texture(){let c=document.createElement('canvas');c.width=1200;c.height=810;let x=c.getContext('2d');x.fillStyle='#f2f6ef';x.fillRect(0,0,1200,810);x.textAlign='center';x.fillStyle='#1f713d';x.font='800 50px Arial';x.fillText(lang==='ru'?'ЭКОЛОГИЧЕСКАЯ БЕЗОПАСНОСТЬ':'ЭКОЛОГИЯЛЫҚ ҚАУІПСІЗДІК',600,65);x.font='22px Arial';x.fillStyle='#52745b';x.fillText('ИНТЕРАКТИВНЫЙ ПУТЬ · 1 → 2 → 3 → 4 → 5 → 6',600,100);let p=[[45,135],[430,135],[815,135],[45,445],[430,445],[815,445]];S.forEach((s,i)=>{let[a,b]=p[i];x.fillStyle='#fff';x.strokeStyle='#65a66e';x.lineWidth=4;x.shadowColor='#0002';x.shadowBlur=14;x.fillRect(a,b,340,235);x.shadowBlur=0;x.strokeRect(a,b,340,235);x.fillStyle='#237641';x.beginPath();x.arc(a+38,b+38,24,0,7);x.fill();x.fillStyle='#fff';x.font='bold 21px Arial';x.fillText(i+1,a+38,b+46);x.textAlign='left';x.fillStyle='#1e4228';x.font='bold 21px Arial';let words=(lang==='ru'?s[0]:s[1]).split(' '),line='',yy=b+78;for(let w of words){if((line+w).length>24){x.fillText(line,a+18,yy);yy+=27;line=''}line+=w+' '}x.fillText(line,a+18,yy);x.fillStyle='#58705d';x.font='17px Arial';let arr=(lang==='ru'?s[2]:s[3]).split('. ');arr.slice(0,3).forEach((v,j)=>x.fillText('• '+v,a+18,b+145+j*27));x.textAlign='center'});return new THREE.CanvasTexture(c)}board.material.map=texture();board.material.needsUpdate=true;
const pos=[[-4,2.05,.25],[-.85,2.05,.25],[2.3,2.05,.25],[-4,-1.05,.25],[-.85,-1.05,.25],[2.3,-1.05,.25]],nodes=[];S.forEach((s,i)=>{let g=new THREE.Group();g.position.set(...pos[i]);let m=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.12,40),new THREE.MeshStandardMaterial({color:[0xd3a92c,0x4d9d5b,0x3b9d8b,0x70b94e,0x4d8fb1,0x5daa54][i],emissive:[0xd3a92c,0x4d9d5b,0x3b9d8b,0x70b94e,0x4d8fb1,0x5daa54][i],emissiveIntensity:.1}));m.rotation.x=Math.PI/2;g.add(m);g.add(new THREE.Mesh(new THREE.TorusGeometry(.43,.025,10,40),new THREE.MeshBasicMaterial({color:m.material.color})));stand.add(g);nodes.push(g)});
const controls=new OrbitControls(cam,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;controls.enableRotate=false;controls.enablePan=true;controls.screenSpacePanning=true;controls.minDistance=6;controls.maxDistance=25;controls.mouseButtons.LEFT=THREE.MOUSE.PAN;controls.mouseButtons.RIGHT=THREE.MOUSE.PAN;controls.touches.ONE=THREE.TOUCH.PAN;controls.touches.TWO=THREE.TOUCH.DOLLY_PAN;
function ui(){let s=S[cur];document.getElementById('num').textContent='0'+(cur+1)+' / 06';document.getElementById('title').textContent=lang==='ru'?s[0]:s[1];document.getElementById('sub').textContent=lang==='ru'?s[2]:s[3];nodes.forEach((n,i)=>n.scale.setScalar(i===cur?1.25:1));let p=document.getElementById('progress');p.innerHTML='';for(let i=0;i<6;i++){let d=document.createElement('div');d.className='dot '+(i===cur?'active':'');d.textContent=i+1;p.appendChild(d);if(i<5){let l=document.createElement('div');l.className='line '+(i<cur?'done':'');p.appendChild(l)}}document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.l===lang));}
function speak(t){if(!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang==='ru'?'ru-RU':'kk-KZ';u.rate=.96;speechSynthesis.speak(u)}function msg(t,user=false){let d=document.createElement('div');d.className='msg '+(user?'userMsg':'aiMsg');d.textContent=t;document.getElementById('chat').appendChild(d);document.getElementById('chat').scrollTop=1e6}
function introAI(){let t=lang==='ru'?'Здравствуйте! Я ваш экологический AI-гид. Перед вами шесть связанных разделов: угрозы, безопасность в Казахстане, сортировка, личные действия, утилизация и участие. Стенд можно перемещать мышью или пальцем, а двумя пальцами — приближать и отдалять. Если хотите подробнее — откройте меня в любой момент.':'Сәлеметсіз бе! Мен сіздің экологиялық AI-гидіңізбін. Алты бөлім арқылы экологиялық қауіптерден табиғатты қорғауға дейін танысамыз. Стендті тышқанмен немесе саусақпен жылжытып, екі саусақпен жақындатуға болады. Қосымша ақпарат керек болса, мен көмектесемін.';msg(t);setTimeout(()=>speak(t),400)}
document.getElementById('start').onclick=async()=>{try{let st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=st;await video.play();document.getElementById('intro').style.display='none';introAI()}catch(e){document.getElementById('status').textContent='Камера не запустилась: '+e.message}};
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{lang=b.dataset.l;board.material.map=texture();board.material.needsUpdate=true;ui()});document.getElementById('aiFab').onclick=()=>{let a=document.getElementById('ai');a.style.display=a.style.display==='flex'?'none':'flex'};
document.getElementById('send').onclick=()=>{let i=document.getElementById('input'),q=i.value.trim();if(!q)return;msg(q,true);i.value='';let n=(q.match(/[1-6]/)||[])[0];let t=n? (lang==='ru'?S[n-1][2]:S[n-1][3]):(lang==='ru'?`Сейчас открыт раздел ${cur+1}: ${S[cur][0]}. Напишите номер 1–6, и я объясню его.`:`Қазір ${cur+1}-бөлім ашық. 1–6 нөмірін жазсаңыз, түсіндіремін.`);if(n){cur=+n-1;ui()}setTimeout(()=>{msg(t);speak(t)},180)};document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('send').click()});document.getElementById('speak').onclick=()=>speak(lang==='ru'?S[cur][2]:S[cur][3]);
let ray=new THREE.Raycaster(),pt=new THREE.Vector2(),sx=0,sy=0;renderer.domElement.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-sx,e.clientY-sy)>8)return;pt.x=e.clientX/innerWidth*2-1;pt.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(pt,cam);let h=ray.intersectObjects(nodes,true)[0];if(h){let n=nodes.indexOf(h.object.parent);if(n>=0){cur=n;ui()}}});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});ui();function loop(){requestAnimationFrame(loop);controls.update();nodes.forEach((n,i)=>n.rotation.z+=i===cur?.003:.001);renderer.render(scene,cam)}loop();
</script></body></html>
